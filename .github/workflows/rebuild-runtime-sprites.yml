name: Rebuild high-resolution runtime sprites

on:
  push:
    branches:
      - fix/runtime-sprite-resolution
    paths:
      - scripts/prepare-car-assets.mjs
      - .github/workflows/rebuild-runtime-sprites.yml
      - src/assets/cars/*-metadata.json
      - src/assets/cars/*.png
      - src/data/game-data.json

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/runtime-sprite-resolution
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Rebuild runtime sprites
        run: node scripts/prepare-car-assets.mjs

      - name: Validate generated game
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Commit generated sprite assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/cars/optimized src/assets/cars/payloads src/assets/cars/catalog.ts
          if git diff --cached --quiet; then
            echo "No generated sprite changes."
            exit 0
          fi
          git commit -m "Regenerate high-resolution runtime sprites"
          git push origin HEAD:fix/runtime-sprite-resolution

name: Build layered sprite review

on:
  push:
    branches:
      - sprite-layering-pass
    paths:
      - "scripts/export-layered-sprites.py"
      - ".github/workflows/sprite-layer-review.yml"
      - "src/assets/cars/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Export layered sprites
        run: python scripts/export-layered-sprites.py

      - name: Package review ZIP
        run: |
          cd sprite-layer-review
          zip -r ../racinggame-layered-sprite-review.zip .

      - name: Upload review package
        uses: actions/upload-artifact@v6
        with:
          name: racinggame-layered-sprite-review
          path: racinggame-layered-sprite-review.zip
          if-no-files-found: error

      - name: Package source sprites for QA
        run: |
          mkdir -p sprite-source-package/src/assets/cars
          mkdir -p sprite-source-package/docs/art/style-reference
          cp src/assets/cars/*.png sprite-source-package/src/assets/cars/
          cp src/assets/cars/catalog.ts sprite-source-package/src/assets/cars/
          cp -r docs/art/style-reference/*.png sprite-source-package/docs/art/style-reference/
          cd sprite-source-package
          zip -r ../racinggame-sprite-sources.zip .

      - name: Upload source sprites
        uses: actions/upload-artifact@v6
        with:
          name: racinggame-sprite-sources
          path: racinggame-sprite-sources.zip
          if-no-files-found: error
